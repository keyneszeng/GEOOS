name: One-time source formatting
on:
  push:
    branches: [chore/geo-maintainability]
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'keyneszeng/GEOOS'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run format
      - run: npm run format
      - run: npm run format:check
      - name: Commit only formatter changes to review branch
        run: |
          git diff --stat
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: expand and normalize source with Prettier 3.6.2"
          git push origin HEAD:refs/heads/chore/geo-maintainability
          git rev-parse HEAD
