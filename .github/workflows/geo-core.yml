name: GEO live core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run geo:test
      - run: node --check geo/server.mjs
      - run: node --check geo/queue.mjs
      - run: node --check geo/analysis.mjs
      - run: node --check geo/knowledge.mjs
      - run: node --check geo/actions.mjs
      - run: node --check geo/agent.mjs
      - run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {Script} from 'node:vm'; new Script(readFileSync('geo/index.html','utf8').split('<script>')[1].split('</script>')[0]);"
      - run: node --check geo/import.mjs
      - run: node --check geo/reviews.mjs
      - run: node --check geo/auth.mjs
      - run: node --check geo/backup.mjs
      - run: node --check geo/workflows.mjs
      - run: node --check geo/planner.mjs
      - run: node --check geo/distribution.mjs
      - name: Build and smoke-test local container
        run: |
          docker build -f Dockerfile.geo -t geo-test .
          docker run -d --name geo-test -p 127.0.0.1:3100:3100 -e GEO_ADMIN_USER=ciadmin -e GEO_ADMIN_PASSWORD=ci-only-password-12345 geo-test
          trap 'docker logs geo-test; docker rm -f geo-test' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/healthz && exit 0; sleep 1; done
          exit 1
