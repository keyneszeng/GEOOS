name: GEO live core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run geo:test
      - run: node --check geo/server.mjs
      - run: node --check geo/queue.mjs
      - run: node --check geo/analysis.mjs
      - run: node --check geo/knowledge.mjs
      - run: node --check geo/actions.mjs
      - run: node --check geo/agent.mjs
      - run: node --input-type=module -e "import {readFileSync} from 'node:fs'; import {Script} from 'node:vm'; new Script(readFileSync('geo/index.html','utf8').split('<script>')[1].split('</script>')[0]);"
      - run: node --check geo/import.mjs
      - run: node --check geo/reviews.mjs
      - run: node --check geo/auth.mjs
