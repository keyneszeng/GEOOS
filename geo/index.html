<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEO/OS · 真实监测</title><style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f1f4f0;color:#17251e;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe3dc;border-radius:14px;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bdc9bf;border-radius:7px;max-width:100%}input,textarea{width:100%}button{background:#193d2a;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3ef;padding:12px}article{border-top:1px solid #ddd;padding:12px 0}</style><main><h1>GEO/OS · 真实监测</h1><p>API 样本 · 本地持久化 · 非消费端排名 · 不使用模拟指标</p><p id="status" role="status"></p><section><h2>企业工作区</h2><form id="workspace"><label>名称<input name="name" required maxlength="100"></label><label>目标品牌<input name="brand" required maxlength="100"></label><label>品牌别名（逗号分隔）<input name="aliases"></label><label>竞品（逗号分隔）<input name="competitors"></label><button>创建工作区</button></form><label>当前工作区<select id="ws"></select></label></section><section><h2>问题库与采样</h2><form id="prompt"><label>真实客户问题（不含品牌词）<textarea name="question" required maxlength="1000"></textarea></label><label>主题<input name="topic" maxlength="100"></label><button>保存问题</button></form><label>监测问题<select id="questions"></select></label><label>已配置 API<select id="provider"></select></label><button id="scan">运行一次真实采样（可能计费）</button><p>请求加入持久化队列，失败后可手动重试。密钥仅存服务端。</p><label>自动监测间隔（分钟，60–10080）<input id="interval" type="number" min="60" max="10080" value="1440"></label><button id="schedule">启用定时采样（可能持续计费）</button><p>仅在本地服务运行时执行；停止计划会取消未运行任务。</p></section><section><h2>采样任务与计划</h2><button id="reload">刷新</button><div id="schedules"></div><div id="jobs"></div></section><section><h2>按问题分析 · 最近 30 天</h2><p>文本提及与明确引用；机会仅是待核查的线索，样本区间假设独立采样。</p><div id="analysis"></div></section><section><h2>近 30 天指标（按 API 与实际模型）</h2><div id="metrics"></div></section><section><h2>最近 100 条原始回答与来源</h2><div id="history"></div></section></main><script>
const $=id=>document.getElementById(id);let current="",running=false;const status=t=>$("status").textContent=t;
async function api(path,data){const r=await fetch("/api/"+path,data===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||"Request failed");return v}
function options(id,values,label,value){$(id).replaceChildren(...values.map(x=>new Option(label(x),value(x))))}
function add(parent,tag,text){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function arr(s){try{return JSON.parse(s||"[]")}catch{return []}}
async function load(){const d=await api("workspaces");options("ws",d.workspaces,x=>x.name+" / "+x.brand,x=>x.id);if(d.workspaces.some(x=>x.id===current))$("ws").value=current;current=$("ws").value;options("provider",d.providers,x=>x,x=>x);status("每日全局请求上限："+d.dailyLimit+"（UTC）。"+(d.providers.length?"":" 尚未配置 AI API。"));await refresh()}
async function refresh(){const id=current;if(!id){options("questions",[],x=>x,x=>x);$("history").replaceChildren();$("metrics").replaceChildren();$("jobs").replaceChildren();$("schedules").replaceChildren();$("analysis").replaceChildren();return}const root="workspaces/"+id+"/";const [p,m,h,jobs,schedules,analysis]=await Promise.all([api(root+"prompts"),api(root+"metrics"),api(root+"samples"),api(root+"jobs"),api(root+"schedules"),api(root+"analysis")]);if(id!==current)return;renderExtra(id,jobs,schedules,analysis);const q=$("questions").value;options("questions",p,x=>x.question,x=>x.id);if(p.some(x=>x.id===q))$("questions").value=q;$("metrics").replaceChildren();$("history").replaceChildren();if(!m.length)add($("metrics"),"p","尚无真实样本");for(const x of m){const rate=v=>v===null?"无有效样本":(100*v).toFixed(1)+"%";add($("metrics"),"p",x.provider+" / "+x.model+" · 有效 "+x.valid+"/"+x.total+" · 品牌文本提及率 "+rate(x.mentionRate)+" · 有引用回答 "+rate(x.citationPresenceRate))}for(const s of h){const a=add($("history"),"article","");add(a,"strong",s.provider+" · "+s.model+" · "+s.status+" · "+s.created_at+" · 样本 "+s.id);add(a,"p",s.question);if(s.answer)add(a,"pre",s.answer);if(s.error)add(a,"p",s.error);if(s.status==="success")add(a,"p","竞品文本命中："+arr(s.competitor_hits).join("、"));for(const [label,urls] of [["明确引用",arr(s.citations)],["检索来源（不一定被引用）",arr(s.sources)]]){if(urls.length)add(a,"strong",label);for(const u of urls)add(a,"p",u)}}}
const split=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
function guard(fn){return async e=>{e?.preventDefault();try{await fn(e)}catch(err){status(err.message)}}}
$("workspace").onsubmit=guard(async e=>{const f=Object.fromEntries(new FormData(e.target));const w=await api("workspaces",{...f,aliases:split(f.aliases),competitors:split(f.competitors)});current=w.id;e.target.reset();await load()});
$("ws").onchange=guard(async()=>{current=$("ws").value;await refresh()});
$("prompt").onsubmit=guard(async e=>{if(!current)throw Error("请先创建工作区");await api("workspaces/"+current+"/prompts",Object.fromEntries(new FormData(e.target)));e.target.reset();await refresh();status("问题已持久保存")});
$("scan").onclick=guard(async()=>{if(running)return;if(!current||!$("questions").value||!$("provider").value)throw Error("请选择工作区、问题及已配置 API");running=true;$("scan").disabled=true;status("正在提交采样任务");try{const s=await api("workspaces/"+current+"/samples",{promptId:$("questions").value,provider:$("provider").value});await refresh();status("任务已进入队列："+s.id)}finally{running=false;$("scan").disabled=false}});
function renderExtra(id,jobs,schedules,analysis){
 for(const el of ["jobs","schedules","analysis"])$(el).replaceChildren();
 const root="workspaces/"+id+"/";
 for(const s of schedules){const a=add($("schedules"),"article","");add(a,"p",s.provider+" · "+s.interval_minutes+" 分钟 · "+(s.enabled?"下次 "+s.next_at:"已停止")+" · 问题 "+s.prompt_id);if(s.enabled){const b=add(a,"button","停止计划");b.onclick=guard(async()=>{await api(root+"schedules",{action:"stop",id:s.id});await refresh()})}}
 for(const j of jobs){const a=add($("jobs"),"article","");add(a,"p",j.provider+" · "+j.state+" · "+j.created_at+" · "+j.id);if(j.error)add(a,"p",j.error);if(["queued","failed","interrupted"].includes(j.state)){const b=add(a,"button",j.state==="queued"?"取消":"重新采样（可能计费）");b.onclick=guard(async()=>{await api(root+"jobs",{action:j.state==="queued"?"cancel":"retry",id:j.id});await refresh()})}}
 const rate=x=>x===null?"暂无":(100*x).toFixed(1)+"%";
 for(const g of analysis){const a=add($("analysis"),"article","");add(a,"strong",g.question+" · "+g.provider+" / "+g.model);add(a,"p","有效 "+g.valid+"/"+g.attempts+" · 文本提及率 "+rate(g.mentionRate)+(g.interval95?" · 95% Wilson 区间 "+g.interval95.map(rate).join("–"):""));for(const c of g.competitors)add(a,"p","竞品 "+c.name+" "+rate(c.rate));for(const s of g.sources.slice(0,10))add(a,"p","引用域名 "+s.host+" · "+s.count+" 条回答");if(g.opportunity){add(a,"p","待核查机会：竞品 "+g.opportunity.competitor+" · 差距 "+rate(g.opportunity.delta));add(a,"p",g.opportunity.action);add(a,"p","证据样本 ID："+g.opportunity.sampleIds.join("、"))}}
}
$("schedule").onclick=guard(async()=>{if(!current||!$("questions").value||!$("provider").value)throw Error("请选择工作区、问题与 API");if(!confirm("启用周期采样将持续产生可能计费的请求，是否确认？"))return;await api("workspaces/"+current+"/schedules",{promptId:$("questions").value,provider:$("provider").value,intervalMinutes:Number($("interval").value)});await refresh();status("定时计划已保存")});
$("reload").onclick=guard(refresh);
setInterval(()=>{if(current&&!running&&!document.hidden)refresh().catch(()=>{})},10000);
load().catch(e=>status(e.message));
</script></html>
