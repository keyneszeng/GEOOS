<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEO/OS · 真实监测</title><style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f1f4f0;color:#17251e;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe3dc;border-radius:14px;padding:20px;margin:16px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bdc9bf;border-radius:7px;max-width:100%}input,textarea{width:100%}button{background:#193d2a;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3ef;padding:12px}article{border-top:1px solid #ddd;padding:12px 0}</style><main><h1>GEO/OS · 真实监测</h1><p>API 样本 · 本地持久化 · 非消费端排名 · 不使用模拟指标</p><p id="status" role="status"></p><section><h2>企业工作区</h2><form id="workspace"><label>名称<input name="name" required maxlength="100"></label><label>目标品牌<input name="brand" required maxlength="100"></label><label>品牌别名（逗号分隔）<input name="aliases"></label><label>竞品（逗号分隔）<input name="competitors"></label><button>创建工作区</button></form><label>当前工作区<select id="ws"></select></label></section><section><h2>问题库与采样</h2><form id="prompt"><label>真实客户问题（不含品牌词）<textarea name="question" required maxlength="1000"></textarea></label><label>主题<input name="topic" maxlength="100"></label><button>保存问题</button></form><label>监测问题<select id="questions"></select></label><label>已配置 API<select id="provider"></select></label><button id="scan">运行一次真实采样（可能计费）</button><p>失败后可手动重试。密钥仅存服务端。</p></section><section><h2>近 30 天指标（按 API 与实际模型）</h2><div id="metrics"></div></section><section><h2>最近 100 条原始回答与来源</h2><div id="history"></div></section></main><script>
const $=id=>document.getElementById(id);let current="",running=false;const status=t=>$("status").textContent=t;
async function api(path,data){const r=await fetch("/api/"+path,data===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||"Request failed");return v}
function options(id,values,label,value){$(id).replaceChildren(...values.map(x=>new Option(label(x),value(x))))}
function add(parent,tag,text){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function arr(s){try{return JSON.parse(s||"[]")}catch{return []}}
async function load(){const d=await api("workspaces");options("ws",d.workspaces,x=>x.name+" / "+x.brand,x=>x.id);if(d.workspaces.some(x=>x.id===current))$("ws").value=current;current=$("ws").value;options("provider",d.providers,x=>x,x=>x);status("每日全局请求上限："+d.dailyLimit+"（UTC）。"+(d.providers.length?"":" 尚未配置 AI API。"));await refresh()}
async function refresh(){const id=current;if(!id){options("questions",[],x=>x,x=>x);$("history").replaceChildren();$("metrics").replaceChildren();return}const root="workspaces/"+id+"/";const [p,m,h]=await Promise.all([api(root+"prompts"),api(root+"metrics"),api(root+"samples")]);if(id!==current)return;const q=$("questions").value;options("questions",p,x=>x.question,x=>x.id);if(p.some(x=>x.id===q))$("questions").value=q;$("metrics").replaceChildren();$("history").replaceChildren();if(!m.length)add($("metrics"),"p","尚无真实样本");for(const x of m){const rate=v=>v===null?"无有效样本":(100*v).toFixed(1)+"%";add($("metrics"),"p",x.provider+" / "+x.model+" · 有效 "+x.valid+"/"+x.total+" · 品牌文本提及率 "+rate(x.mentionRate)+" · 有引用回答 "+rate(x.citationPresenceRate))}for(const s of h){const a=add($("history"),"article","");add(a,"strong",s.provider+" · "+s.model+" · "+s.status+" · "+s.created_at);add(a,"p",s.question);if(s.answer)add(a,"pre",s.answer);if(s.error)add(a,"p",s.error);if(s.status==="success")add(a,"p","竞品文本命中："+arr(s.competitor_hits).join("、"));for(const [label,urls] of [["明确引用",arr(s.citations)],["检索来源（不一定被引用）",arr(s.sources)]]){if(urls.length)add(a,"strong",label);for(const u of urls)add(a,"p",u)}}}
const split=s=>s.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
function guard(fn){return async e=>{e?.preventDefault();try{await fn(e)}catch(err){status(err.message)}}}
$("workspace").onsubmit=guard(async e=>{const f=Object.fromEntries(new FormData(e.target));const w=await api("workspaces",{...f,aliases:split(f.aliases),competitors:split(f.competitors)});current=w.id;e.target.reset();await load()});
$("ws").onchange=guard(async()=>{current=$("ws").value;await refresh()});
$("prompt").onsubmit=guard(async e=>{if(!current)throw Error("请先创建工作区");await api("workspaces/"+current+"/prompts",Object.fromEntries(new FormData(e.target)));e.target.reset();await refresh();status("问题已持久保存")});
$("scan").onclick=guard(async()=>{if(running)return;if(!current||!$("questions").value||!$("provider").value)throw Error("请选择工作区、问题及已配置 API");running=true;$("scan").disabled=true;status("真实请求中，请勿重复提交");try{const s=await api("workspaces/"+current+"/samples",{promptId:$("questions").value,provider:$("provider").value});await refresh();status(s.status==="success"?"真实采样已保存":"采样失败，失败记录已保存："+s.error)}finally{running=false;$("scan").disabled=false}});
load().catch(e=>status(e.message));
</script></html>
